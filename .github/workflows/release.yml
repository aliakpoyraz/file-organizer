name: release

# Build standalone `fo` binaries for each OS/arch and attach them to the
# GitHub Release when a version tag (e.g. v0.1.0) is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon
            asset: fo-macos-arm64
          - os: macos-13        # Intel
            asset: fo-macos-x86_64
          - os: ubuntu-latest
            asset: fo-linux-x86_64
          - os: windows-latest
            asset: fo-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + PyInstaller
        run: python -m pip install . pyinstaller

      - name: Build binary (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller packaging/fo.spec
          mv dist/fo "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller packaging/fo.spec
          Move-Item dist/fo.exe "dist/${{ matrix.asset }}"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
